<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoldSrc BSP Viewer - Showcase</title>
    <link rel="stylesheet" href="./styles.css">
    <script>
        // Polyfill for Node.js globals in the browser
        window.global = window;
        window.process = {
            env: {
                NODE_ENV: 'production'
            }
        };
        window.Buffer = window.Buffer || [];
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://esm.sh/three@>=0.137.0",
                "three/addons/": "https://esm.sh/three@>=0.137.0/examples/jsm/",
                "three/examples/": "https://esm.sh/three@>=0.137.0/examples/",
                "react": "https://esm.sh/react@^18.0.0",
                "react-dom": "https://esm.sh/react-dom@^18.0.0",
                "react-dom/client": "https://esm.sh/react-dom@^18.0.0/client",
                "lucide-react": "https://esm.sh/lucide-react@^0.474.0",
                "react/jsx-runtime": "https://esm.sh/react@^18.0.0/jsx-runtime"
            }
        }
    </script>
</head>
<body>
    <div id="ui-overlay">
        <header>
            <h1>GoldSrc BSP Viewer</h1>
        </header>

        <div class="panel upload-panel">
            <h2>Load Map</h2>
            <div class="input-group">
                <label for="bsp-input">Select .bsp file:</label>
                <input type="file" id="bsp-input" accept=".bsp">
            </div>

            <div class="input-group">
                <label for="wad-input">Select .wad files (optional):</label>
                <input type="file" id="wad-input" accept=".wad" multiple>
            </div>

            <div class="input-group">
                <label for="fgd-input">Select .fgd file (optional):</label>
                <input type="file" id="fgd-input" accept=".fgd">
            </div>

            <button id="load-btn">Load Map</button>
        </div>

        <div id="toast-container"></div>

        <div class="panel inspector-panel" id="inspector-panel" style="display: none;">
            <h2>Entity Inspector</h2>
            <div id="entity-classname" class="entity-classname">No entity selected</div>
            <div class="entity-properties" id="entity-properties">
                <!-- Key-value pairs will be injected here -->
            </div>
        </div>

        <div class="panel controls-panel">
            <h2>Controls</h2>
            <ul>
                <li><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd> - Move</li>
                <li><kbd>Mouse</kbd> - Look around</li>
                <li><kbd>Click</kbd> - Lock mouse</li>
                <li><kbd>ESC</kbd> - Unlock mouse</li>
                <li><kbd>Left Click</kbd> on entity - Select</li>
            </ul>
        </div>
    </div>

    <div id="viewer-container"></div>

    <button id="settings-fab" aria-label="Settings">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    </button>

    <dialog id="settings-modal" class="modal">
        <div class="modal-content panel">
            <div class="modal-header">
                <h2>Settings</h2>
                <button id="close-settings" class="close-btn">&times;</button>
            </div>

            <div class="input-group">
                <label for="texture-filtering">Texture Filtering:</label>
                <select id="texture-filtering">
                    <option value="true">Linear</option>
                    <option value="false">Nearest</option>
                </select>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="lightmap-filtering" checked>
                <label for="lightmap-filtering">Lightmap Filtering</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="show-brush-entities" checked>
                <label for="show-brush-entities">Show Brush Entities</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="show-wireframes">
                <label for="show-wireframes">Show Wireframes</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="show-axes" checked>
                <label for="show-axes">Show Axes</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="show-crosshair">
                <label for="show-crosshair">Show Crosshair</label>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="auto-pointer-lock" checked>
                <label for="auto-pointer-lock">Auto Pointer Lock</label>
            </div>

            <div class="input-group">
                <label for="aaa-trigger-opacity">AAATRIGGER Opacity: <span id="aaa-trigger-opacity-val">0.3</span></label>
                <input type="range" id="aaa-trigger-opacity" min="0" max="1" step="0.1" value="0.3">
            </div>
        </div>
    </dialog>

    <script type="module" src="./app.js"></script>
</body>
</html>
